<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grade 8 Unit 2 — Homework Week 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#eaeefc; --surface:#fff; --surface2:#f3f5ff; --ink:#12153a; --mute:#555b85; --line:#d4d9f3;
  --accent:#1f5cff; --gold:#ffc61a; --gold-ink:#3a2a00;
  --good:#0f8a4b; --good-bg:#d9f5e5; --bad:#d6293e; --bad-bg:#fde0e4;
  --f-display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-math:"Cambria Math","STIX Two Text","Times New Roman",Georgia,serif;
  --shadow:0 2px 0 rgba(18,21,58,.10),0 10px 24px rgba(18,21,58,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding:0 max(14px,env(safe-area-inset-right)) 60px max(14px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto}
.hero{padding:22px 0 8px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(var(--gold),var(--gold)) no-repeat 0 92%/100% .22em;padding-inline:.04em}
.hero p{margin:8px 0 0;max-width:46ch;color:var(--mute)}
.stat{background:var(--surface);border-radius:16px;padding:10px 20px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font:800 2.2rem var(--f-display);font-variant-numeric:tabular-nums}
.stat small{color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:700}
.bar{height:18px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden;margin:12px 0 4px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff9d1a);border-radius:99px;transition:width .6s cubic-bezier(.3,.9,.3,1)}
.msg{font-weight:700;min-height:1.5em}
nav{position:sticky;top:0;z-index:20;margin:0 -14px;padding:8px 14px;background:rgba(234,238,252,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
nav ul{list-style:none;margin:0 auto;padding:0;max-width:1120px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav a{display:flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none;color:var(--ink);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;box-shadow:var(--shadow);border:2px solid transparent;font-size:.95rem}
nav a .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
nav a small{color:var(--mute);font-weight:700}
nav a.on{border-color:var(--c)}
nav a.full{background:var(--good-bg)}
section{margin-top:34px}
.shead{display:flex;gap:14px;align-items:center;background:var(--c);color:#fff;border-radius:20px;padding:16px 20px;box-shadow:var(--shadow)}
.shead .qn{font:800 2.4rem var(--f-display);background:rgba(255,255,255,.2);border-radius:14px;padding:4px 14px;line-height:1.1}
.shead h2{font-size:clamp(1.15rem,3.4vw,1.7rem);font-weight:800;color:#fff}
.shead small{display:block;opacity:.9;font-weight:700;margin-top:4px}
.rule{margin:14px 0 0;background:var(--surface);border-left:8px solid var(--gold);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow)}
.rule b{font-family:var(--f-display);font-size:1.05rem}
.rule p{margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px;margin-top:18px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .top{background:var(--c);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
.card .top h3{font-size:1.15rem;font-weight:800;color:#fff;flex:1}
.card .top .em{font-size:1.5rem}
.card .top .tick{font-size:1.4rem;opacity:0;transform:scale(.3);transition:.3s}
.card.done .top .tick{opacity:1;transform:none}
.prob{padding:14px 12px 6px;text-align:center;font-size:2rem;background:var(--surface2);border-bottom:2px dashed var(--line);overflow-x:auto}
.m{font-family:var(--f-math);font-size:1em;line-height:1.5}
.m i{font-style:italic}
.m .tx{font-family:var(--f-body);font-size:.5em;font-style:normal;color:var(--mute);margin:0 .5em;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.m .op{margin:0 .22em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em}
.fr .n{padding:0 .22em;border-bottom:.07em solid currentColor;line-height:1.25}
.fr .d{padding:0 .22em;line-height:1.25}
sup{font-size:.62em;vertical-align:.6em;line-height:0}
.pl{padding:12px 14px 4px}
.pl h4,.qz h4{margin:0 0 8px;font:800 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
.steps{display:flex;flex-direction:column;gap:8px;min-height:64px}
.hint0{color:var(--mute);font-style:italic;padding:14px 0;text-align:center}
.step{background:var(--surface2);border-radius:14px;padding:8px 12px;border-left:6px solid var(--c);animation:in .45s cubic-bezier(.2,.9,.2,1) both;overflow-x:auto}
.step .m{font-size:1.45rem}
.step p{margin:0;color:var(--mute);font-size:.93rem}
.step .no{float:right;font:800 .75rem var(--f-display);color:var(--c);margin-left:8px}
.step.final{background:var(--gold);color:var(--gold-ink);border-left-color:#c98f00;animation:in .5s cubic-bezier(.3,1.5,.5,1) both}
.step.final p{color:#5a4200}
.step.final .m{font-size:1.75rem;font-weight:700}
.step.final .no{color:#7a5600}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--line);transition:transform .08s;min-height:44px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--c);border-color:var(--c);color:#fff}
.ctr{margin-left:auto;font-weight:700;color:var(--mute);font-size:.85rem}
.qz{padding:12px 14px 16px;margin-top:8px;border-top:2px dashed var(--line)}
.qz .q{font-size:1.15rem;margin-bottom:10px;line-height:1.7}
.qz .q .m{font-size:1.5rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:8px;min-height:62px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);text-align:left;min-width:0;overflow:hidden}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font:800 .9rem var(--f-display);color:var(--mute)}
.opt .m{font-size:1.3rem;min-width:0}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);opacity:.8}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{margin-top:10px;border-radius:14px;padding:10px 14px;animation:in .3s ease-out both}
.fb.ok{background:var(--good-bg);border:2px solid var(--good)}
.fb.no{background:var(--bad-bg);border:2px solid var(--bad)}
.fb b{font:800 1.15rem var(--f-display);display:block}
.fb p{margin:2px 0 0}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx i{position:absolute;width:9px;height:14px;border-radius:2px;animation:conf 1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.finale{display:none;margin-top:30px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:28px;text-align:center}
.finale.show{display:block;animation:in .5s both}
.finale h2{font-size:2.2rem}
footer{margin-top:40px;text-align:center;color:var(--mute);font-size:.9rem}
@media (max-width:520px){.opts{grid-template-columns:1fr 1fr}.opt .m{font-size:1.15rem}.prob{font-size:1.7rem}.shead .qn{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="wrap">
<header class="hero">
 <div><h1>Grade 8 Unit 2 — <span>Homework Week 9</span></h1>
 <p>Watch the working one step at a time, then try the quick quiz on a similar problem. 29 boxes, you can do them in any order!</p></div>
 <div class="stat"><b id="score">0/29</b><small>Quizzes correct</small></div>
</header>
<div class="bar" id="pb" role="progressbar" aria-valuemin="0" aria-valuemax="29" aria-valuenow="0"><i id="fill"></i></div>
<div class="msg" id="msg"></div>
</div>
<nav aria-label="Sections"><ul id="navul"></ul></nav>
<div class="wrap">
<main id="main"></main>
<div class="finale" id="finale"><div style="font-size:3.5rem">🏆</div><h2>All 29 correct!</h2><p>Brilliant work, Lucas. Every single box is done.</p></div>
<footer><button class="btn" id="reset" type="button">Start again</button></footer>
</div>
<script>
const SECTIONS=[
{n:1,color:'#1f5cff',emoji:'🔍',title:'Expand each expression and find the highest common factor (HCF)',
 rule:'<b>Rule reminder:</b> write each term as prime factors × letters, then circle what is in <i>both</i>. Multiply the circled bits to get the HCF. E.g. $8x^2 = 2·2·2·x·x$.',
 cards:[
 {label:'Q1 · Box 1',prob:'8x^2 {and} 12xy',steps:[
  ['8x^2 = 2·2·2·x·x','Break 8 into prime factors and write x² as x·x.'],
  ['12xy = 2·2·3·x·y','Do the same for 12xy, where 12 = 2·2·3.'],
  ['{Both have} 2·2·x','Spot what appears in both lists: two 2s and one x.'],
  ['{HCF} = 2·2·x = 4x','Multiply the shared factors together to get the answer.']],
  quiz:{q:'{HCF of} 6x^2 {and} 9xy',a:'3x',why:'6x² = 2·3·x·x and 9xy = 3·3·x·y, so they share 3·x.',w:[['3','The letter x is shared too, so it belongs in the HCF.'],['3x^2','Only one x is in 9xy, so you can only share one x.'],['3xy','There is no y in 6x², so y cannot be shared.']]}},
 {label:'Q1 · Box 2',prob:'24y {and} 36y^2',steps:[
  ['24y = 2·2·2·3·y','Break 24 into prime factors, then add the y.'],
  ['36y^2 = 2·2·3·3·y·y','36 = 2·2·3·3 and y² is y·y.'],
  ['{Both have} 2·2·3·y','Shared: two 2s, one 3 and one y.'],
  ['{HCF} = 2·2·3·y = 12y','Multiply the shared factors: 2×2×3 = 12.']],
  quiz:{q:'{HCF of} 18y {and} 27y^2',a:'9y',why:'18y = 2·3·3·y and 27y² = 3·3·3·y·y, so they share 3·3·y = 9y.',w:[['9','Do not forget the shared letter y.'],['9y^2','18y only has one y, so only one y is shared.'],['3y','3 does go into both, but 9 is bigger and also goes into both.']]}},
 {label:'Q1 · Box 3',prob:'6a^3b {and} 15ab^2',steps:[
  ['6a^3b = 2·3·a·a·a·b','6 = 2·3, a³ is three a’s, and one b.'],
  ['15ab^2 = 3·5·a·b·b','15 = 3·5, one a, and b² is b·b.'],
  ['{Both have} 3·a·b','Shared: one 3, one a and one b.'],
  ['{HCF} = 3·a·b = 3ab','Multiply the shared factors together.']],
  quiz:{q:'{HCF of} 10a^2b {and} 4ab^3',a:'2ab',why:'10a²b = 2·5·a·a·b and 4ab³ = 2·2·a·b·b·b, so they share 2·a·b.',w:[['2a^2b','4ab³ has only one a, so only one a is shared.'],['2ab^3','10a²b has only one b, so only one b is shared.'],['2','The letters a and b are shared too.']]}}]},
{n:2,color:'#7a3cff',emoji:'✂️',title:'Expand and simplify',
 rule:'<b>Rule reminder:</b> simplify the numbers first. Then for each letter: top power − bottom power. Whatever is left stays where it was (top or bottom).',
 cards:[
 {label:'Q2 · Box 1',prob:'[2a^2|6ab]',steps:[
  ['[2|6] = [1|3]','Numbers first: divide top and bottom by 2.'],
  ['[a^2|a] = a','Top power minus bottom power: 2 − 1 = 1, so one a is left on top.'],
  ['b {stays below}','There is no b on top to cancel it, so it stays underneath.'],
  ['[a|3b]','Put it all together.']],
  quiz:{q:'{Simplify} [3b^2|9ab]',a:'[b|3a]',why:'3/9 = 1/3, b²÷b = b (on top), and a stays on the bottom.',w:[['[b^2|3a]','b² ÷ b leaves b, not b². Subtract the powers: 2 − 1 = 1.'],['[3b|9a]','Remember to simplify the numbers: 3/9 = 1/3.'],['[a|3b]','The b ends up on top and the a on the bottom, not the other way round.']]}},
 {label:'Q2 · Box 2',prob:'[6m^3|9m]',steps:[
  ['[6|9] = [2|3]','Divide top and bottom by 3.'],
  ['[m^3|m] = m^2','Subtract the powers: 3 − 1 = 2 (m on its own is m¹).'],
  ['[2m^2|3]','Put the number part and the letter part together.']],
  quiz:{q:'{Simplify} [4k^4|10k]',a:'[2k^3|5]',why:'4/10 = 2/5 and k⁴ ÷ k = k³.',w:[['[2k^4|5]','k on the bottom takes one k off the top: 4 − 1 = 3.'],['[4k^3|10]','The numbers can still be simplified: 4/10 = 2/5.'],['[2k^5|5]','You add powers when multiplying. When dividing you subtract.']]}},
 {label:'Q2 · Box 3',prob:'[x^2y^4|xy^2]',steps:[
  ['[x^2|x] = x','Subtract the powers: 2 − 1 = 1.'],
  ['[y^4|y^2] = y^2','Subtract the powers: 4 − 2 = 2.'],
  ['xy^2','Both letters are left on top, so write them together.']],
  quiz:{q:'{Simplify} [a^3b^5|ab^2]',a:'a^2b^3',why:'a: 3 − 1 = 2, b: 5 − 2 = 3.',w:[['a^4b^7','You added the powers. For division, subtract them.'],['a^2b^5','You only did the a. Do the b as well: 5 − 2 = 3.'],['a^3b^3','You only did the b. Do the a as well: 3 − 1 = 2.']]}},
 {label:'Q2 · Box 4',prob:'[10a^2bc^3|12abc^2]',steps:[
  ['[10|12] = [5|6]','Numbers first: divide top and bottom by 2.'],
  ['[a^2|a] = a','2 − 1 = 1, so one a is left on top.'],
  ['[b|b] = 1','Same power on top and bottom, so b cancels completely.'],
  ['[c^3|c^2] = c','3 − 2 = 1, so one c is left on top.'],
  ['[5ac|6]','Put the leftovers together.']],
  quiz:{q:'{Simplify} [8x^3yz^2|12xyz]',a:'[2x^2z|3]',why:'8/12 = 2/3, x: 3 − 1 = 2, y cancels, z: 2 − 1 = 1.',w:[['[2x^2yz|3]','The y on top and y on the bottom cancel out completely.'],['[8x^2z|12]','Simplify the numbers too: 8/12 = 2/3.'],['[2x^4z^3|3]','You added the powers. Subtract them when dividing.']]}}]},
{n:3,color:'#e83e8c',emoji:'✖️',title:'Calculate, expand and simplify',
 rule:'<b>Rule reminder:</b> multiplying fractions = top × top and bottom × bottom, then simplify. Dividing = <i>keep</i> the first, <i>change</i> ÷ to ×, <i>flip</i> the second.',
 cards:[
 {label:'Q3 · Top left',prob:'[10|x] × [x|2]',steps:[
  ['[10|x] × [x|2] = [10x|2x]','Multiply tops together and bottoms together.'],
  ['[10x|2x] = [10|2]','The x on top and the x on the bottom cancel.'],
  ['5','10 ÷ 2 = 5.']],
  quiz:{q:'{Simplify} [12|x] × [x|3]',a:'4',why:'Top 12x, bottom 3x. The x cancels and 12 ÷ 3 = 4.',w:[['36','You multiplied 12 × 3. Divide instead after cancelling the x.'],['[4|x^2]','The x on top cancels the x on the bottom completely.'],['9','You subtracted. Cancelling means dividing: 12 ÷ 3.']]}},
 {label:'Q3 · Top middle',prob:'[4x|y] · [xy|6x]',steps:[
  ['[4x|y] · [xy|6x] = [4x^2y|6xy]','Top: 4x·xy = 4x²y. Bottom: y·6x = 6xy.'],
  ['[4|6] = [2|3]','Simplify the numbers: divide by 2.'],
  ['[x^2|x] = x {and} [y|y] = 1','Subtract powers for x, and y cancels.'],
  ['[2x|3]','Put the leftovers together.']],
  quiz:{q:'{Simplify fully} [3x|y] · [xy|6x]',a:'[x|2]',why:'Product is 3x²y / 6xy. 3/6 = 1/2, x²÷x = x, y cancels.',w:[['[x^2|2]','x² on top and x below: 2 − 1 = 1, so just x is left.'],['[3x|6]','The numbers can still be simplified: 3/6 = 1/2.'],['[x|2y]','The y on top and bottom cancel completely.']]}},
 {label:'Q3 · Top right',prob:'[a^2|3b] · [6b^3|5a^2]',steps:[
  ['[6a^2b^3|15a^2b]','Top: a²·6b³. Bottom: 3b·5a² = 15a²b.'],
  ['[6|15] = [2|5]','Divide the numbers by 3.'],
  ['[a^2|a^2] = 1 {and} [b^3|b] = b^2','a² cancels completely, and b: 3 − 1 = 2.'],
  ['[2b^2|5]','Put it all together.']],
  quiz:{q:'{Simplify fully} [b^2|2a] · [4a^3|3b^2]',a:'[2a^2|3]',why:'Product is 4a³b² / 6ab². 4/6 = 2/3, a³÷a = a², b² cancels.',w:[['[4a^2|6]','Simplify the numbers: 4/6 = 2/3.'],['[2a^4|3]','You added the powers. Subtract them: 3 − 1 = 2.'],['[2a^2b^2|3]','b² on the top and bottom cancel completely.']]}},
 {label:'Q3 · Bottom left',prob:'[x|2] ÷ [4|x]',steps:[
  ['[x|2] ÷ [4|x] = [x|2] × [x|4]','Keep, change, flip: turn ÷ into × and flip the second fraction.'],
  ['[x·x|2·4]','Multiply tops together and bottoms together.'],
  ['[x^2|8]','x·x = x² and 2×4 = 8.']],
  quiz:{q:'{Simplify} [x|3] ÷ [5|x]',a:'[x^2|15]',why:'Flip the second: x/3 × x/5 = x²/15.',w:[['[15|x^2]','You flipped the first fraction. Keep the first, flip the second.'],['[x|15]','x × x makes x², not x.'],['[5|3]','You forgot to flip. Turn ÷ into × and flip 5/x to x/5.']]}},
 {label:'Q3 · Bottom middle',prob:'[12a|b^2] ÷ [9a|b^2]',steps:[
  ['[12a|b^2] × [b^2|9a]','Keep, change, flip.'],
  ['[12ab^2|9ab^2]','Multiply tops and bottoms.'],
  ['[12|9]','a and b² appear on top and bottom, so they cancel.'],
  ['[4|3]','Simplify: divide top and bottom by 3.']],
  quiz:{q:'{Simplify} [10y|x^2] ÷ [15y|x^2]',a:'[2|3]',why:'Flip and multiply: 10y·x² / x²·15y = 10/15 = 2/3.',w:[['[3|2]','You flipped your answer upside down. Only flip the second fraction at the start.'],['[10|15]','You can still simplify: divide top and bottom by 5.'],['[2y|3]','The y on top and bottom cancel.']]}},
 {label:'Q3 · Bottom right',prob:'[5xy|7x] ÷ [3y|6]',steps:[
  ['[5xy|7x] × [6|3y]','Keep, change, flip.'],
  ['[30xy|21xy]','Top: 5xy·6 = 30xy. Bottom: 7x·3y = 21xy.'],
  ['[30|21]','xy is on both top and bottom, so it cancels.'],
  ['[10|7]','Divide top and bottom by 3.']],
  quiz:{q:'{Simplify} [4xy|5x] ÷ [2y|10]',a:'4',why:'Flip: 4xy/5x × 10/2y = 40xy / 10xy = 4.',w:[['[4y^2|25]','You did not flip. Turn ÷ into × and flip the second fraction.'],['[1|4]','You flipped the first fraction. Keep the first and flip the second.'],['[4y|5]','You simplified the first fraction but forgot to divide by the second.']]}}]},
{n:4,color:'#ff7a1a',emoji:'➕',title:'Simplify using the multiplication exponent law',
 rule:'<b>Rule reminder:</b> $a^m·a^n = a^(m+n)$. Same letter: <i>add</i> the powers. Numbers in front multiply. A letter on its own is $^1$.',
 cards:[
 {label:'Q4 · Box 1',prob:'3^2 × 3^3',steps:[
  ['3^2 × 3^3 = 3^(2+3)','Same base (3), so add the powers.'],
  ['3^5','2 + 3 = 5.'],
  ['3^5 = 243','3×3×3×3×3 = 243.']],
  quiz:{q:'{Work out} 2^3 × 2^4',a:'2^7 = 128',why:'Add the powers: 3 + 4 = 7, and 2⁷ = 128.',w:[['4^7','Keep the base the same. Do not multiply the bases.'],['2^12','You multiplied the powers. Add them instead.'],['14','2⁷ means 2 multiplied seven times, not 2 × 7.']]}},
 {label:'Q4 · Box 2',prob:'x^6 · x^8',steps:[

(function(){
"use strict";
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function M(s){
  var out='',i=0,m;
  while(i<s.length){
    var c=s[i];
    if(c==='['){
      var d=0,j=i;
      for(;j<s.length;j++){if(s[j]==='[')d++;else if(s[j]===']'){d--;if(d===0)break;}}
      var inner=s.slice(i+1,j),k=-1,dd=0;
      for(var t=0;t<inner.length;t++){var ch=inner[t];if(ch==='[')dd++;else if(ch===']')dd--;else if(ch==='|'&&dd===0){k=t;break;}}
      out+='<span class="fr"><span class="n">'+M(inner.slice(0,k))+'</span><span class="d">'+M(inner.slice(k+1))+'</span></span>';
      i=j+1;
    }else if(c==='{'){
      var e=s.indexOf('}',i);out+='<span class="tx">'+esc(s.slice(i+1,e))+'</span>';i=e+1;
    }else if(c==='^'){
      if(s[i+1]==='('){
        var dp=0,q=i+1;
        for(;q<s.length;q++){if(s[q]==='(')dp++;else if(s[q]===')'){dp--;if(dp===0)break;}}
        out+='<sup>'+M(s.slice(i+2,q))+'</sup>';i=q+1;
      }else{
        m=/^\d+/.exec(s.slice(i+1));
        out+='<sup>'+(m?m[0]:'')+'</sup>';i+=1+(m?m[0].length:0);
      }
    }else if(/[a-zA-Z]/.test(c)){out+='<i>'+c+'</i>';i++;}
    else if(c==='='||c==='×'||c==='÷'||c==='·'){out+='<span class="op">'+c+'</span>';i++;}
    else if(c===' '){out+=' ';i++;}
    else{out+=esc(c);i++;}
  }
  return out;
}
function MM(s){return '<span class="m">'+M(s)+'</span>';}
function rich(s){return s.split('$').map(function(p,i){return i%2?MM(p):p;}).join('');}
function plain(s){return rich(esc(s).replace(/&amp;/g,'&'));}

// seeded shuffle so the right answer isn't always first
function shuffle(arr,seed){
  var a=arr.slice(),x=seed*9301+49297;
  for(var i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;var j=Math.floor(x/233280*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

var TOTAL=0,score=0,state={},KEY='lucas-maths-w9';
SECTIONS.forEach(function(s){TOTAL+=s.cards.length;});
try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object')state=saved;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function count(){var n=0;for(var k in state){if(state[k])n++;}return n;}

var main=document.getElementById('main'),navul=document.getElementById('navul'),fx=document.getElementById('fx');
var cardEls={};
var LET=['A','B','C','D'];

function boom(el){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#ffc61a','#e83e8c','#1f5cff','#1aa05a','#7a3cff','#ff7a1a'];
  for(var i=0;i<26;i++){var p=document.createElement('i');p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=cols[i%6];
    p.style.setProperty('--dx',((Math.random()-.5)*340)+'px');p.style.setProperty('--dy',(-60-Math.random()*200)+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');fx.appendChild(p);}
  setTimeout(function(){fx.innerHTML='';},1100);
}

function buildCard(sec,card,idx,gi){
  var id=sec.n+'-'+idx;
  var art=document.createElement('article');art.className='card';art.style.setProperty('--c',sec.color);art.id='c-'+id;
  var steps=card.steps,n=steps.length,shown=0,timer=null;
  art.innerHTML=
   '<div class="top"><span class="em" aria-hidden="true">'+sec.emoji+'</span><h3>'+esc(card.label)+'</h3><span class="tick" aria-hidden="true">⭐</span></div>'+
   '<div class="prob" aria-label="Problem">'+MM(card.prob)+'</div>'+
   '<div class="pl"><h4>Step-by-step</h4><div class="steps" aria-live="polite"></div>'+
   '<div class="ctrl"><button class="btn primary nx" type="button">▶ Next step</button><button class="btn rp" type="button">⟲ Replay</button><button class="btn sa" type="button">Show all</button><span class="ctr"></span></div></div>'+
   '<div class="qz"><h4>Your turn · quick quiz</h4><div class="q">'+MM(card.quiz.q)+'</div><div class="opts"></div><div class="fbh"></div></div>';
  var box=art.querySelector('.steps'),nx=art.querySelector('.nx'),rp=art.querySelector('.rp'),sa=art.querySelector('.sa'),ctr=art.querySelector('.ctr');
  function upd(){
    ctr.textContent=shown?('Step '+shown+' of '+n):(n+' steps');
    nx.disabled=shown>=n;sa.disabled=shown>=n;
    nx.textContent=shown===0?'▶ Start':'▶ Next step';
    if(shown>=n)nx.textContent='✔ Done';
    if(!shown)box.innerHTML='<div class="hint0">Press ▶ to watch the working, one line at a time.</div>';
  }
  function add(){
    if(shown>=n)return;
    if(shown===0)box.innerHTML='';
    var s=steps[shown],last=shown===n-1,d=document.createElement('div');
    d.className='step'+(last?' final':'');
    d.innerHTML='<span class="no">'+(last?'ANSWER ✨':'Step '+(shown+1))+'</span>'+MM(s[0])+'<p>'+plain(s[1])+'</p>';
    box.appendChild(d);shown++;upd();
  }
  function stop(){if(timer){clearTimeout(timer);timer=null;}}
  nx.onclick=function(){stop();add();};
  sa.onclick=function(){stop();while(shown<n)add();};
  rp.onclick=function(){stop();shown=0;box.innerHTML='';upd();(function go(){add();if(shown<n)timer=setTimeout(go,1500);})();};
  upd();

  // quiz
  var q=card.quiz,all=[{m:q.a,ok:true,hint:''}].concat(q.w.map(function(w){return{m:w[0],ok:false,hint:w[1]};}));
  var opts=shuffle(all,gi+3),oc=art.querySelector('.opts'),fbh=art.querySelector('.fbh');
  opts.forEach(function(o,i){
    var b=document.createElement('button');b.type='button';b.className='opt';
    b.innerHTML='<span class="k">'+LET[i]+'</span>'+MM(o.m);
    b.onclick=function(){
      if(o.ok){
        b.classList.add('right');
        [].forEach.call(oc.children,function(x){x.disabled=true;});
        fbh.innerHTML='<div class="fb ok"><b>🎉 Correct!</b><p>'+plain(q.why)+'</p></div>';
        if(!state[id]){state[id]=1;save();}
        art.classList.add('done');boom(b);refresh(true);
      }else{
        b.classList.add('wrong','shake');b.disabled=true;
        fbh.innerHTML='<div class="fb no"><b>Not quite, try again!</b><p>💡 '+plain(o.hint)+'</p></div>';
      }
    };
    oc.appendChild(b);
  });
  if(state[id]){
    art.classList.add('done');
    [].forEach.call(oc.children,function(x,i){x.disabled=true;if(opts[i].ok)x.classList.add('right');});
    fbh.innerHTML='<div class="fb ok"><b>✅ Done</b><p>'+plain(q.why)+'</p></div>';
  }
  return art;
}

var navLinks={},bars={};
SECTIONS.forEach(function(sec){
  var gi0=0;
  var s=document.createElement('section');s.id='q'+sec.n;s.style.setProperty('--c',sec.color);
  s.innerHTML='<div class="shead"><span class="qn">Q'+sec.n+'</span><div><h2>'+esc(sec.title)+'</h2><small class="sc"></small></div></div>'+
    '<div class="rule">'+rich(sec.rule)+'</div><div class="grid"></div>';
  var g=s.querySelector('.grid');
  sec.cards.forEach(function(c,i){var gi=sec.n*10+i;var el=buildCard(sec,c,i+1,gi);g.appendChild(el);});
  main.appendChild(s);bars[sec.n]=s.querySelector('.sc');
  var li=document.createElement('li');li.innerHTML='<a href="#q'+sec.n+'" style="--c:'+sec.color+'"><span class="dot"></span>Q'+sec.n+' <small></small></a>';
  navul.appendChild(li);navLinks[sec.n]=li.firstChild;
});

var MSGS=[[0,'Let’s go! Pick any question.'],[1,'Great start! Keep going.'],[8,'You’re on a roll! 🔥'],[15,'More than halfway there! 🚀'],[22,'Nearly there, superstar! ⭐'],[29,'ALL DONE! Maths champion! 🏆']];
function refresh(celebrate){
  var n=count();
  document.getElementById('score').textContent=n+'/'+TOTAL;
  document.getElementById('fill').style.width=(100*n/TOTAL)+'%';
  document.getElementById('pb').setAttribute('aria-valuenow',n);
  var m=MSGS[0][1];MSGS.forEach(function(x){if(n>=x[0])m=x[1];});
  document.getElementById('msg').textContent=m;
  SECTIONS.forEach(function(sec){
    var k=0;sec.cards.forEach(function(c,i){if(state[sec.n+'-'+(i+1)])k++;});
    bars[sec.n].textContent=k+' of '+sec.cards.length+' quizzes correct';
    navLinks[sec.n].querySelector('small').textContent=k+'/'+sec.cards.length;
    navLinks[sec.n].classList.toggle('full',k===sec.cards.length);
  });
  var f=document.getElementById('finale');
  if(n>=TOTAL){f.classList.add('show');if(celebrate){setTimeout(function(){boom(document.getElementById('score'));},200);}}
  else f.classList.remove('show');
}
refresh(false);

// scroll spy
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var n=e.target.id.slice(1);for(var k in navLinks)navLinks[k].classList.toggle('on',k===n);}});},{rootMargin:'-30% 0px -60% 0px'});
  SECTIONS.forEach(function(s){io.observe(document.getElementById('q'+s.n));});
}
document.getElementById('reset').onclick=function(){if(confirm('Start again from zero?')){state={};save();location.reload();}};
})();
